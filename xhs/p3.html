<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1440px; overflow:hidden; }
  body { font-family:"PingFang SC","Hiragino Sans GB",-apple-system,sans-serif;
    background:#0B0D12; color:#fff; position:relative; }
  .glow{ position:absolute; width:820px;height:820px; right:-240px; top:-200px;
    background:radial-gradient(circle,rgba(122,158,255,.28) 0%,rgba(122,158,255,0) 68%); }
  .wrap{ position:relative; padding:74px 68px; height:100%; display:flex; flex-direction:column; }

  .kicker{ display:inline-flex; align-self:flex-start; padding:12px 24px; border-radius:10px;
    background:rgba(122,158,255,.1); border:1px solid rgba(122,158,255,.28);
    font-size:26px; color:#9BB6FF; letter-spacing:.1em; font-weight:600; }

  h2{ margin-top:34px; font-size:78px; line-height:1.24; font-weight:900; color:#F4F6FA; }
  h2 .dim{ color:#7A8699; }

  .steps{ margin-top:44px; display:flex; flex-direction:column; gap:22px; }
  .step{ display:flex; gap:24px; align-items:flex-start; }
  .step .no{ flex-shrink:0; font-size:34px; font-weight:900; color:#8FB0FF; width:52px;
    line-height:1.3; }
  .step .body .t{ font-size:38px; font-weight:700; color:#EAEFF8; line-height:1.4; }
  .step .body .d{ margin-top:8px; font-size:28px; color:#8B95A8; line-height:1.55; }

  .shot{ margin-top:40px; border-radius:20px; overflow:hidden;
    border:1px solid rgba(255,255,255,.13);
    box-shadow:0 28px 70px rgba(0,0,0,.7); background:#12151C; }
  .shot img{ display:block; width:100%; }
  .cap{ margin-top:18px; font-size:26px; color:#66707F; line-height:1.5; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <div class="kicker">我 的 解 法</div>
    <h2>离线做图，<br>其实就<span class="dim">三步</span></h2>

    <div class="steps">
      <div class="step">
        <div class="no">01</div>
        <div class="body">
          <div class="t">整批拖进去</div>
          <div class="d">文件、文件夹都行，子目录自动扫；图片和 PDF 可以混着拖</div>
        </div>
      </div>
      <div class="step">
        <div class="no">02</div>
        <div class="body">
          <div class="t">只填一个数：目标体积</div>
          <div class="d">写 300 KB，它先降编码质量，还不够才缩尺寸，尽量少损失画质</div>
        </div>
      </div>
      <div class="step">
        <div class="no">03</div>
        <div class="body">
          <div class="t">点开始，等它跑完</div>
          <div class="d">逐条给结果，成功失败都写清楚原因，最后告诉你省了多少</div>
        </div>
      </div>
    </div>

    <div class="shot">
      <img src="file:///Users/shahao/Project/file-processor/docs/images/单张对比.png">
    </div>
    <div class="cap">原图和结果并排看，体积和尺寸都标在两边。整个过程程序不联网。</div>
  </div>
</body>
</html>
