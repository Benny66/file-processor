name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  # 静态检查：护栏 + lint（不启动 GUI）
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install frontend deps
        run: cd frontend && npm install

      # 必须先构建前端：根包（main.go）用 //go:embed 嵌入 frontend/dist，
      # 而该目录被 gitignore —— 干净检出里没有它，编译根包会失败：
      #   `pattern all:frontend/dist: no matching files found`
      # 此前本 job 只 npm install 不构建，导致 check 每次必红。
      - name: Build frontend (供 go:embed 使用)
        run: cd frontend && npm run build

      - name: Run tests (含护栏)
        run: make test

      - name: Run lint
        run: make lint

  # Linux .deb 单独成 job（见下方 linux-deb）：
  #   - 麒麟 V10 SP1 是 glibc 2.31 + 仅 WebKitGTK 4.0-37，与 Ubuntu 20.04 一致；
  #   - 因此固定 container: ubuntu:20.04，而不是跟随 runner 镜像漂移；
#   - VM 标签同样钉死 ubuntu-24.04：2026-10-19 起 ubuntu-latest 舰队逐步切 Ubuntu 26，
#     混编期间「新宿主 + 20.04 容器」组合出现过 dpkg-deb 校验误红（同刻同配方的
#     release 腿全绿），不跟着漂移标签走；
  #   - 产物 .deb 作为 artifact 上传，供真机安装冒烟。
  #
  # 桌面编译矩阵（只编译，不启动 GUI）只含 macOS/Windows。

  # Kylin / Linux .deb 构建（glibc 2.31 + WebKitGTK 2.28.1）
  linux-deb:
    needs: check
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    steps:
      # ubuntu:20.04 最小镜像没有 git，checkout 之前必须先装
      - name: Install git for checkout
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v7

      - name: Install Linux build deps
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config curl file \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev=2.28.1-1 \
            libwebkit2gtk-4.0-37=2.28.1-1 \
            gir1.2-webkit2-4.0=2.28.1-1 \
            libjavascriptcoregtk-4.0-dev=2.28.1-1 \
            libjavascriptcoregtk-4.0-18=2.28.1-1 \
            gir1.2-javascriptcoregtk-4.0=2.28.1-1

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build frontend
        run: cd frontend && npm install && npm run build

      - name: Build and package .deb
        run: bash scripts/package.sh linux

      # 元数据断言：架构/包名/版本任一不符即红（package-deb.sh 只写不校验，这里补上）
      - name: 校验 .deb 元数据
        run: |
          set -euo pipefail
          APP="$(node -p "require('./wails.json').outputfilename")"
          V="$(node -p "require('./wails.json').info.productVersion")"
          DEB="build/bin/${APP}_${V}_amd64.deb"
          [ -f "$DEB" ] || { echo "未找到 $DEB" >&2; exit 1; }
          # 诊断遥测：job 日志需管理员权限，失败细节进 annotation（公开 API 可读，2026-10-24 排障）
          dpkg-deb --version | head -1
          ls -la build/bin/ || true
          if ! dpkg-deb --info "$DEB" > /tmp/deb-info.txt 2>/tmp/deb-err.txt; then
            echo "::error title=dpkg-deb --info 失败::$(dpkg-deb --version | head -1) | $(head -c 300 /tmp/deb-err.txt | tr '\n' ' ') | $(ls -la "$DEB" | tr -s ' ') | 头部:$(head -c 60 "$DEB" | od -An -c | tr '\n' ' ' | head -c 200)"
            exit 2
          fi
          grep -E '^ Package: imageworkshop$' /tmp/deb-info.txt
          grep -E '^ Architecture: amd64$' /tmp/deb-info.txt
          grep -E "^ Version: ${V}$" /tmp/deb-info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: build/bin/*.deb
          if-no-files-found: error

  # 信创 arm64（飞腾/鲲鹏）.deb：amd64 容器内 clang/lld 交叉构建（ADR-0006；
  # QEMU 模拟在 dpkg/Go 阶段有段错误前科，不走模拟）。
  # 跑在 VM 而非 container 指令里：本腿需要 docker 起交叉构建容器。
  # 只产 artifact、不接 Release——arm64 未经真机验收前不宣称可发布（D-45）。
  linux-deb-arm64:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build frontend
        run: cd frontend && npm install && npm run build

      - name: Build and package arm64 .deb (Docker 交叉)
        run: bash scripts/package.sh linux user arm64

      # 元数据断言：错架构/错版本的包发出去就是「装上跑不起来」（与 amd64 腿同款）
      - name: 校验 .deb 元数据
        run: |
          set -euo pipefail
          APP="$(node -p "require('./wails.json').outputfilename")"
          V="$(node -p "require('./wails.json').info.productVersion")"
          DEB="build/bin/${APP}_${V}_arm64.deb"
          [ -f "$DEB" ] || { echo "未找到 $DEB" >&2; exit 1; }
          # 诊断遥测：job 日志需管理员权限，失败细节进 annotation（公开 API 可读，2026-10-24 排障）
          dpkg-deb --version | head -1
          ls -la build/bin/ || true
          if ! dpkg-deb --info "$DEB" > /tmp/deb-info.txt 2>/tmp/deb-err.txt; then
            echo "::error title=dpkg-deb --info 失败::$(dpkg-deb --version | head -1) | $(head -c 300 /tmp/deb-err.txt | tr '\n' ' ') | $(ls -la "$DEB" | tr -s ' ') | 头部:$(head -c 60 "$DEB" | od -An -c | tr '\n' ' ' | head -c 200)"
            exit 2
          fi
          grep -E '^ Package: imageworkshop$' /tmp/deb-info.txt
          grep -E '^ Architecture: arm64$' /tmp/deb-info.txt
          grep -E "^ Version: ${V}$" /tmp/deb-info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb-arm64
          path: build/bin/*_arm64.deb
          if-no-files-found: error
  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Install frontend deps
        run: cd frontend && npm install

      - name: Build
        run: make build

      # 生成器端到端验证：连生 2 个模块 → 生成 bindings → 编译 → gofmt → 护栏。
      # 这是本仓唯一的端到端检查，历史上抓到过 3 个真实 bug（缺 import / 注入非幂等 /
      # 产物不符 gofmt），此前只在本地跑、靠人记得。
      # 只跑一次即可（检查内容与平台无关）；放在 macos 腿是因为 Windows runner 无 rsync。
      - name: Generator end-to-end (verify-gen)
        if: matrix.os == 'macos-latest'
        run: make verify-gen

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: build/bin/
