name: Release

# 打 tag 即自动发布：构建安装包 → 创建 Release（含自动生成的变更说明）→ 附加产物。
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# 版本号取自 tag（去掉前缀 v），经 scripts/set-version.sh 写入单一真相，
# 再由 wails 渲染进 macOS Info.plist / Windows exe 版本资源 / NSIS 注册表。
#
# 四个 job，平台腿只传产物、release 单点建 Release（避免抢建）：
#   1. verify        —— 不从不绿的提交发版（tag 可以打在任意提交上）
#   2. package       —— macOS / Windows matrix 并行打包，产物作为 workflow artifact 传递
#   3. package-linux —— Linux .deb 腿：钉死 ubuntu:20.04 容器（麒麟 glibc 2.31 +
#      加 VM 钉 ubuntu-24.04——ubuntu-latest 正切 Ubuntu 26，混编期宿主代次不可控；
#                       WebKitGTK 2.28.1，与 build.yml 的 linux-deb 同环境）。
#                       不并入 package matrix——matrix 条目跑在 VM 上，本腿需要 container
#   4. release       —— 三腿都成功后，单点创建 Release 并附加全部产物
on:
  push:
    tags: ['v*']

# 创建 Release 需要写权限
permissions:
  contents: write

jobs:
  # 发版前先跑一遍静态检查：tag 可能被打在没走过 CI 的提交上
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install frontend deps
        run: cd frontend && npm install

      # 根包用 //go:embed 嵌入 frontend/dist，干净检出里没有它，必须先构建前端
      - name: Build frontend (供 go:embed 使用)
        run: cd frontend && npm run build

      - name: Run tests (含护栏)
        run: make test

      - name: Run lint
        run: make lint

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # 与 build.yml 钉同一版本：发布链与验证链的工具链必须一致，@latest 会漂移
      - name: Install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Install frontend deps
        run: cd frontend && npm install

      # Windows 安装器需要 NSIS；缺了 package.sh 会降级成裸 exe（不是安装器）。
      #
      # 实测坑：runner 上 NSIS 可能【已安装但不在 PATH 上】，只查 PATH 会误判为「没装」，
      # 于是白白装一遍却仍用不了。故：先按安装位置找，再决定是否安装，
      # 最后写进 GITHUB_PATH 供后续步骤使用（export 只影响本步骤）。
      - name: Ensure NSIS (makensis)
        if: matrix.target == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          NSIS_WIN='C:\Program Files (x86)\NSIS'
          NSIS_SH='/c/Program Files (x86)/NSIS'
          if [ -x "$NSIS_SH/makensis.exe" ]; then
            echo "makensis 已安装（$NSIS_WIN）"
          else
            echo "未检测到 NSIS，尝试安装..."
            choco install nsis -y --no-progress
          fi
          echo "$NSIS_WIN" >> "$GITHUB_PATH"
          export PATH="$PATH:$NSIS_SH"
          command -v makensis >/dev/null 2>&1 \
            || { echo "错误：makensis 不可用，无法生成 .exe 安装器（查找路径 $NSIS_WIN）" >&2; exit 1; }
          echo "makensis 就绪" 

      - name: 写入版本号（取自 tag）
        shell: bash
        run: bash scripts/set-version.sh "${GITHUB_REF_NAME#v}"

      # 母版（含占位符）不能打包——package.sh 会拒绝，这里提前识别并跳过。
      # 占位符【拆写】：本文件不在 init.sh 的替换范围内（*.yml 不在其列表），
      # 写成连续字面量会在实例化后仍匹配，导致「永远是母版」的误判。
      - name: Detect template
        id: template
        shell: bash
        run: |
          PH='__APP_''NAME__'
          if git grep -q "$PH" -- go.mod wails.json main.go 2>/dev/null; then
            echo "is_template=true" >> "$GITHUB_OUTPUT"
            echo "::notice::检测到母版占位符——跳过打包（母版无安装包可发，Release 只带源码归档）"
          else
            echo "is_template=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        if: steps.template.outputs.is_template == 'false'
        run: make package os=${{ matrix.target }}

      # 产物按「应用名-版本-平台」重命名，用户看到的就是可用的资产名
      - name: 收集产物
        if: steps.template.outputs.is_template == 'false'
        shell: bash
        run: |
          set -euo pipefail
          APP="$(node -p "require('./wails.json').outputfilename")"
          V="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          if [ -f "build/bin/${APP}.dmg" ]; then
            cp "build/bin/${APP}.dmg" "dist/${APP}-${V}-macos-universal.dmg"
          fi
          if [ -f "build/bin/${APP}-amd64-installer.exe" ]; then
            cp "build/bin/${APP}-amd64-installer.exe" "dist/${APP}-${V}-windows-amd64-setup.exe"
          elif [ -f "build/bin/${APP}.exe" ]; then
            cp "build/bin/${APP}.exe" "dist/${APP}-${V}-windows-amd64.exe"
          fi
          echo "本次收集到的产物："
          ls -la dist || true

      - uses: actions/upload-artifact@v4
        if: steps.template.outputs.is_template == 'false'
        with:
          name: installers-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Linux .deb 腿：tag 发布时产出 .deb 汇入同一 Release。
  # 环境与 build.yml 的 linux-deb job 完全一致（麒麟 glibc 2.31 + WebKitGTK 2.28.1，
  # 固定 ubuntu:20.04 容器不随 runner 漂移），因此两边依赖版本必须同步改。
  package-linux:
    needs: verify
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    steps:
      # ubuntu:20.04 最小镜像没有 git，checkout 之前必须先装
      - name: Install git for checkout
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v7

      - name: Install Linux build deps
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config curl file \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev=2.28.1-1 \
            libwebkit2gtk-4.0-37=2.28.1-1 \
            gir1.2-webkit2-4.0=2.28.1-1 \
            libjavascriptcoregtk-4.0-dev=2.28.1-1 \
            libjavascriptcoregtk-4.0-18=2.28.1-1 \
            gir1.2-javascriptcoregtk-4.0=2.28.1-1

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: 写入版本号（取自 tag）
        shell: bash
        run: bash scripts/set-version.sh "${GITHUB_REF_NAME#v}"

      # 与 package 两腿同款母版防呆（占位符拆写，原因见上）
      - name: Detect template
        id: template
        shell: bash
        run: |
          PH='__APP_''NAME__'
          if git grep -q "$PH" -- go.mod wails.json main.go 2>/dev/null; then
            echo "is_template=true" >> "$GITHUB_OUTPUT"
            echo "::notice::检测到母版占位符——跳过打包（母版无安装包可发，Release 只带源码归档）"
          else
            echo "is_template=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build frontend
        if: steps.template.outputs.is_template == 'false'
        run: cd frontend && npm install && npm run build

      - name: Package .deb
        if: steps.template.outputs.is_template == 'false'
        run: bash scripts/package.sh linux

      # 元数据断言：架构/包名/版本任一不符即红，不把错包发进 Release
      - name: 校验 .deb 元数据
        if: steps.template.outputs.is_template == 'false'
        shell: bash
        run: |
          set -euo pipefail
          APP="$(node -p "require('./wails.json').outputfilename")"
          V="${GITHUB_REF_NAME#v}"
          DEB="build/bin/${APP}_${V}_amd64.deb"
          [ -f "$DEB" ] || { echo "未找到 $DEB" >&2; exit 1; }
          # 诊断遥测：job 日志需管理员权限，失败细节进 annotation（公开 API 可读，2026-10-24 排障）
          dpkg-deb --version | head -1
          ls -la build/bin/ || true
          if ! dpkg-deb --info "$DEB" > /tmp/deb-info.txt 2>/tmp/deb-err.txt; then
            echo "::error title=dpkg-deb --info 失败::$(dpkg-deb --version | head -1) | $(head -c 300 /tmp/deb-err.txt | tr '\n' ' ') | $(ls -la "$DEB" | tr -s ' ') | 头部:$(head -c 60 "$DEB" | od -An -c | tr '\n' ' ' | head -c 200)"
            exit 2
          fi
          grep -E '^ Package: imageworkshop$' /tmp/deb-info.txt
          grep -E '^ Architecture: amd64$' /tmp/deb-info.txt
          grep -E "^ Version: ${V}$" /tmp/deb-info.txt
          echo "✓ deb 元数据校验通过（imageworkshop / amd64 / ${V}）"

      # 资产名与其他平台同款「应用名-版本-平台-架构」
      - name: 收集产物
        if: steps.template.outputs.is_template == 'false'
        shell: bash
        run: |
          set -euo pipefail
          APP="$(node -p "require('./wails.json').outputfilename")"
          V="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp "build/bin/${APP}_${V}_amd64.deb" "dist/${APP}-${V}-linux-amd64.deb"
          echo "本次收集到的产物："
          ls -la dist

      - uses: actions/upload-artifact@v4
        if: steps.template.outputs.is_template == 'false'
        with:
          name: installers-linux
          path: dist/*
          if-no-files-found: error

  release:
    needs: [verify, package, package-linux]
    runs-on: ubuntu-24.04
    steps:
      # gh 需要仓库上下文（推断 owner/repo）——没有 checkout 会直接报
      # 「not a git repository」。这一步不是为了取文件，是为了给 gh 上下文。
      - uses: actions/checkout@v7

      # 母版不产安装包，此处没有 artifact 可下载——不是错误，Release 仍会带源码归档
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: dist
          merge-multiple: true

      - name: 创建 Release 并附加产物
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # 失败时先看清是不是权限/认证问题（GITHUB_TOKEN 的 contents 权限）
          gh auth status 2>&1 | head -3 || true
          # 先查后建：同一 tag 的失败重跑不该卡在「Release 已存在」上。
          # 本 job 是单点执行（package 两条腿只传产物、不碰 Release），故无并发风险。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在——本次只追加产物"
          else
            # --generate-notes：变更说明由 GitHub 按提交/PR 自动生成，不必手写
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          if [ -d dist ] && [ -n "$(ls -A dist 2>/dev/null)" ]; then
            # 无签名分发：给全部产物生成校验和一并上传（网盘/IM 转发后可自查完整性）。
            # 先在 /tmp 生成再落位，避免 SHA256SUMS.txt 自己被算进去。
            ( cd dist && sha256sum -- * > /tmp/SHA256SUMS.txt ) \
              && mv /tmp/SHA256SUMS.txt dist/SHA256SUMS.txt
            gh release upload "$TAG" dist/* --clobber
            echo "已附加产物："
            ls -la dist
          else
            echo "无安装包产物——Release 只含 GitHub 自动附加的源码归档（母版即如此）"
          fi
